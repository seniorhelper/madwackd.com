<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="EARTH title card">
<style>
.spin{animation:spin 24s linear infinite}
.eyeL{animation:wl 1.6s ease-in-out infinite}
.eyeR{animation:wr 1.9s ease-in-out infinite}
.tw{animation:tw 3s ease-in-out infinite}
.tw2{animation:tw 4.2s ease-in-out 1s infinite}
@keyframes spin{from{transform:translateX(0)}to{transform:translateX(-300px)}}
@keyframes wl{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,2px)}75%{transform:translate(3px,3px)}}
@keyframes wr{0%,100%{transform:translate(0,0)}30%{transform:translate(-4px,3px)}55%{transform:translate(4px,-2px)}80%{transform:translate(-3px,-3px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.spin,.eyeL,.eyeR,.tw,.tw2{animation:none}}
</style>
<defs>
<radialGradient id="sky" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2A1640"/><stop offset="1" stop-color="#0B0916"/></radialGradient>
<radialGradient id="sea" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#4FD2FF"/><stop offset=".55" stop-color="#1E6FE0"/><stop offset="1" stop-color="#173B9C"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="#00B8F0" stop-opacity=".45"/><stop offset="1" stop-color="#00B8F0" stop-opacity="0"/></radialGradient>
<clipPath id="ball"><circle cx="480" cy="215" r="146"/></clipPath>
<g id="land" fill="#7ED321" stroke="#3E8E12" stroke-width="3">
<path d="M352 120c28-26 74-20 92 4 14 20-6 38-30 40-18 2-22 22-40 30-26 10-46-12-44-36 1-16 8-27 22-38z"/>
<path d="M420 250c22-14 56-8 66 14 10 22-4 52-30 62-24 10-50-2-56-24-4-20 4-40 20-52z"/>
<path d="M520 110c20-8 46 2 52 22 6 22-14 34-12 54 2 22-18 34-36 26-20-10-22-36-26-56-4-20 4-38 22-46z"/>
<path d="M560 270c16-10 40-6 46 10 6 18-10 34-28 36-16 2-30-8-30-22 0-10 4-18 12-24z"/>
</g>
</defs>
<rect width="960" height="540" fill="url(#sky)"/>
<g fill="#fff">
<circle class="tw" cx="80" cy="60" r="2"/><circle cx="160" cy="150" r="1.5"/><circle class="tw2" cx="240" cy="70" r="2"/><circle cx="120" cy="300" r="1.5"/><circle class="tw" cx="60" cy="420" r="2"/>
<circle cx="860" cy="80" r="2"/><circle class="tw2" cx="780" cy="160" r="1.5"/><circle class="tw" cx="900" cy="260" r="2"/><circle cx="820" cy="380" r="1.5"/><circle class="tw2" cx="700" cy="60" r="2"/>
<circle cx="300" cy="40" r="1.5"/><circle cx="660" cy="30" r="1.5"/><circle class="tw" cx="200" cy="230" r="1.5"/><circle cx="760" cy="300" r="1.5"/><circle cx="890" cy="470" r="1.5"/><circle cx="40" cy="180" r="1.5"/>
</g>
<circle cx="480" cy="215" r="190" fill="url(#halo)"/>
<ellipse cx="480" cy="215" rx="230" ry="46" fill="none" stroke="#FF2E93" stroke-width="3" stroke-dasharray="10 12" opacity=".75" transform="rotate(-12 480 215)"/>
<circle cx="480" cy="215" r="146" fill="url(#sea)"/>
<g clip-path="url(#ball)"><g class="spin"><use href="#land"/><use href="#land" x="300"/></g></g>
<circle cx="480" cy="215" r="146" fill="none" stroke="#15121F" stroke-width="6"/>
<g stroke="#15121F" stroke-width="5">
<circle cx="440" cy="190" r="30" fill="#fff"/><circle cx="522" cy="190" r="30" fill="#fff"/>
</g>
<g class="eyeL"><circle cx="444" cy="196" r="12" fill="#15121F"/><circle cx="440" cy="191" r="3.5" fill="#fff"/></g>
<g class="eyeR"><circle cx="518" cy="196" r="12" fill="#15121F"/><circle cx="514" cy="191" r="3.5" fill="#fff"/></g>
<path d="M440 252q41 36 82 0" fill="none" stroke="#15121F" stroke-width="7" stroke-linecap="round"/>
<text x="480" y="452" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="104" letter-spacing="10" fill="#FFD60A" stroke="#15121F" stroke-width="5" paint-order="stroke fill">EARTH</text>
<text x="480" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="4" fill="#E6FAFF">A MADWACKD PRODUCTIONS FEATURE  ·  SUMMER 2027</text>
</svg>
